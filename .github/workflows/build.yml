name: 多平台构建
permissions:
  contents: write
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            os_name: Windows
            artifact_name: wuge_tools-Windows
            spec_file: wuge_tools.spec
          - os: ubuntu-latest
            os_name: Linux
            artifact_name: wuge_tools-Linux
            spec_file: wuge_tools.spec
          - os: macos-latest
            os_name: macOS
            artifact_name: wuge_tools-macOS
            spec_file: wuge_tools.spec

    runs-on: ${{ matrix.os }}
    env:
      OS_NAME: ${{ matrix.os_name }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Linux 安装系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libgl1 \
            libgl1-mesa-dri \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libxrender1 \
            libxi6 \
            libxrandr2 \
            libxss1 \
            libxcursor1 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxtst6 \
            libglib2.0-0

      - name: 构建主程序 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean wuge_tools.spec

      - name: 构建更新助手 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean update.spec

      - name: 构建主程序 (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean \
            --onefile \
            --windowed \
            --name 个人小工具 \
            --add-data "app_icon.png:." \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtNetwork \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtQuick3D \
            --exclude-module PySide6.Qt3DCore \
            --exclude-module PySide6.Qt3DRender \
            --exclude-module PySide6.QtBluetooth \
            --exclude-module PySide6.QtCharts \
            --exclude-module PySide6.QtDataVisualization \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtMultimediaWidgets \
            --exclude-module PySide6.QtNetworkAuth \
            --exclude-module PySide6.QtPositioning \
            --exclude-module PySide6.QtPrintSupport \
            --exclude-module PySide6.QtSensors \
            --exclude-module PySide6.QtSerialPort \
            --exclude-module PySide6.QtSql \
            --exclude-module PySide6.QtSvg \
            --exclude-module PySide6.QtTest \
            --exclude-module PySide6.QtWebChannel \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module PySide6.QtWebSockets \
            --exclude-module tkinter \
            --exclude-module unittest \
            main.py

      - name: 构建更新助手 (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --noconfirm --clean \
            --windowed \
            --noupx \
            --name update \
            --add-data "app_icon.png:." \
            --hidden-import PySide6.QtWidgets \
            --hidden-import PySide6.QtCore \
            --hidden-import PySide6.QtGui \
            --hidden-import PySide6.QtNetwork \
            --exclude-module PySide6.QtQml \
            --exclude-module PySide6.QtQuick \
            --exclude-module PySide6.QtMultimedia \
            --exclude-module PySide6.QtWebEngineCore \
            --exclude-module PySide6.QtWebEngineWidgets \
            --exclude-module tkinter \
            --exclude-module unittest \
            updater_app/updater_main.py

      - name: 打包为 ZIP (Windows,程序根平铺)
        if: matrix.os == 'windows-latest'
        run: |
          python -c "
          import zipfile, os
          root='dist'
          members=['个人小工具.exe','update']
          missing=[m for m in members if not os.path.exists(os.path.join(root,m))]
          assert not missing, f'缺少打包成员:{missing}'
          z=zipfile.ZipFile(f'wuge_tools-{os.environ[\"OS_NAME\"]}.zip','w',zipfile.ZIP_DEFLATED)
          for m in members:
              src_path = os.path.join(root, m)
              if os.path.isdir(src_path):
                  for dp, _, fs in os.walk(src_path):
                      for f in fs:
                          full_file = os.path.join(dp, f)
                          arc_name = os.path.relpath(full_file, root)
                          z.write(full_file, arc_name)
              else:
                  z.write(src_path, m)
          z.close()
          print('archive members:',members)
                    "
                    python -c "
          import zipfile, os
          zip_name = f'wuge_tools-{os.environ[\"OS_NAME\"]}.zip'
          z=zipfile.ZipFile(zip_name)
          names=z.namelist()
          assert '个人小工具.exe' in names and 'update/update.exe' in names and any(n.startswith('update/lib/') for n in names)
          assert not any(n.replace('\\','/').split('/')[0] in {'data_store','accounts','checkin_record','cookies','downloads','logs','mail_result'} for n in names)
          print('archive layout ok')
                    "

      - name: 打包为 tar.gz (Linux/macOS,程序根平铺)
        if: matrix.os != 'windows-latest'
        run: |
          chmod +x dist/个人小工具
          chmod +x dist/update/update
          python -c "import tarfile, os; root='dist'; members=['个人小工具','update']; missing=[m for m in members if not os.path.exists(os.path.join(root,m))]; assert not missing, f'缺少打包成员:{missing}'; t=tarfile.open(f'wuge_tools-{os.environ[\"OS_NAME\"]}.tar.gz','w:gz'); [t.add(os.path.join(root,m),arcname=m) for m in members]; t.close(); print('archive members:',members)"
          python -c "import tarfile, os; t=tarfile.open(f'wuge_tools-{os.environ[\"OS_NAME\"]}.tar.gz'); names=t.getnames(); assert '个人小工具' in names and 'update/update' in names; assert not any(n.split('/')[0] in {'data_store','accounts','checkin_record','cookies','downloads','logs','mail_result'} for n in names); print('archive layout ok')"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.os == 'windows-latest' && format('wuge_tools-{0}.zip', matrix.os_name) || format('wuge_tools-{0}.tar.gz', matrix.os_name) }}
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有产物
        uses: actions/download-artifact@v4

      - name: 创建 Release 并上传构建产物
        uses: softprops/action-gh-release@v3
        with:
          name: wuge_tools ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            # wuge_tools ${{ github.ref_name }}
            | 项目 | 参数 |
            |------|------|
            | 版本 | ${{ github.ref_name }} |
            | 构建时间 | ${{ github.event.head_commit.timestamp }} |
            | Git SHA | ${{ github.sha }} |
            > 多平台构建产物,解压后即可运行
          files: |
            wuge_tools-Windows/wuge_tools-Windows.zip
            wuge_tools-Linux/wuge_tools-Linux.tar.gz
            wuge_tools-macOS/wuge_tools-macOS.tar.gz
          fail_on_unmatched_files: true
